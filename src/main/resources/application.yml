spring:
  application:
    name: jwt-tutorial

  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@localhost:1521:XE}
    username: ${ORACLE_DB_USERNAME}
    password: ${ORACLE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

# Creates missing tables and updates the schema for local development.
# Use validate with a separately managed schema in production.
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  level:
    com.example.jwttutorial: DEBUG