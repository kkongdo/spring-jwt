spring:
  application:
    name: jwt-tutorial

  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@localhost:1521:XE}
    username: ${ORACLE_DB_USERNAME}
    password: ${ORACLE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.OracleDialect

logging:
  level:
    com.example.jwttutorial: DEBUG
